# Run the same Python binding gate on every PR and in the full CI matrix.
name: Python API
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: Build the reusable Python library
        run: |
          cmake -S . -B build/python-api -DCMAKE_BUILD_TYPE=${{ matrix.mode }} "-DCMAKE_C_FLAGS_DEBUG=-O1 -g1" "-DCMAKE_CXX_FLAGS_DEBUG=-O1 -g1" -DTACTIX_BUILD_SHARED_IPASIR=ON
          cmake --build build/python-api --target tactix_shared test_bve_order test_online_sequence --parallel 2
      - name: Python ABI, ER, policy components, sessions/cores, and shared build boundary
        run: |
          ctest --test-dir build/python-api --output-on-failure --output-log build/python-api/python-tests.log --no-tests=error -R '^(python_|symmetry_backend_build_boundary$)'
          python3 - <<'PY'
          from pathlib import Path
          log = Path('build/python-api/python-tests.log').read_text()
          import json, subprocess
          inventory = json.loads(subprocess.check_output([
              'ctest', '--test-dir', 'build/python-api', '--show-only=json-v1',
              '-R', '^(python_|symmetry_backend_build_boundary$)'], text=True))
          names = {test['name'] for test in inventory['tests']}
          assert {'python_capi', 'python_extended_resolution', 'python_bve_order', 'python_online_sequence',
                  'python_policy_parity',
                  'python_session', 'python_restart_clock',
                  'symmetry_backend_build_boundary'} <= names, names
          assert f'out of {len(names)}' in log
          assert '***Skipped' not in log and 'Not Run' not in log
          PY
