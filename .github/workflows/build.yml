name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tactix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zlib1g-dev

      - name: Configure release build
        run: >-
          cmake -S . -B build/ci-release
          -DCMAKE_BUILD_TYPE=Release
          -DTACTIX_BUILD_TESTS=OFF

      - name: Build Tactix release
        run: >-
          cmake --build build/ci-release --parallel 2
          --target tactix tactix_archive

      - name: Configure unit tests
        run: >-
          cmake -S . -B build/ci-tests
          -DCMAKE_BUILD_TYPE=Debug
          -DTACTIX_BUILD_TESTS=ON

      - name: Build unit tests
        run: >-
          cmake --build build/ci-tests --parallel 2 --target
          test_parse test_strategy_config test_bve_occurrence_cache

      - name: Run unit tests
        run: >-
          ctest --test-dir build/ci-tests --output-on-failure
          -R '^(parse|strategy_config|bve_occurrence_cache)$'
