name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tactix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zlib1g-dev

      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DTACTIX_BUILD_TESTS=ON

      - name: Build Tactix
        run: >-
          cmake --build build/ci --parallel 2 --target
          tactix tactix_archive
          test_parse test_proof test_bve_occurrence_cache

      - name: Run unit tests
        run: >-
          ctest --test-dir build/ci --output-on-failure
          -R '^(parse|proof|bve_occurrence_cache)$'
