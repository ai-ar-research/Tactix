# CI checks the validator harness, native Debug/Release solver, and Python API
# in parallel, using the pinned solver/checker toolchain.
name: ci

on:
  # The full sanitizer, checker-toolchain, and fuzz matrix is intentionally
  # weekly to keep GitHub Actions minutes bounded. Run it on demand before a
  # milestone merge with the Actions UI when fresher evidence is required.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: Fuzz harness self-test (stand-ins + broken wrappers + ddmin)
        run: tools/fuzz/selftest.sh

  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          sanitizer: ${{ matrix.mode == 'debug' }}
      # Each test links the full solver. Clang and compressed debug sections
      # bound disk usage while retaining ASan/UBSan, assertions and symbols.
      - name: Build tactix
        run: |
          tactix_compiler_args=()
          if [ '${{ matrix.mode }}' = debug ]; then
            tactix_compiler_args=(-DCMAKE_C_COMPILER=/usr/bin/clang-18 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-18 -DCMAKE_EXE_LINKER_FLAGS=-Wl,--compress-debug-sections=zlib)
            /usr/bin/clang++-18 --version
          fi
          df -h .
          cmake --preset ${{ matrix.mode }} "${tactix_compiler_args[@]}" -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          cmake --build build/${{ matrix.mode }} --parallel 2
          du -sh build/${{ matrix.mode }}
          df -h .
      - name: Unit + micro-proof tests
        run: |
          # Clang-ASan inlines several fixture-local kernels into test main;
          # the largest observed instrumented test frame is about 47 MiB.
          if [ '${{ matrix.mode }}' = debug ]; then ulimit -s 65536; fi
          ctest --preset ${{ matrix.mode }} --no-tests=error --output-log build/${{ matrix.mode }}/ctest.log
          ! grep -E '\*\*\*Skipped|Not Run' build/${{ matrix.mode }}/ctest.log
      - name: Competition compliance
        if: matrix.mode == 'release'
        run: tools/compete/check.sh ./build/release/tactix
      # 300 cases bound runner time; the full --quick gate runs locally
      # (plan §8.2 cadence).
      - name: Quick fuzz (debug build, all oracles)
        if: matrix.mode == 'debug'
        run: tools/fuzz/run.sh --quick --solver "./build/debug/tactix {proof}" --no-shrink --n 300

      # rule-order fuzzing (plan §8.2): random legal schedules + random
      # branching instances through the same four oracles — the modularity
      # property (N1) under continuous test
      - name: Quick fuzz, random rule schedule (debug build)
        if: matrix.mode == 'debug'
        run: tools/fuzz/run.sh --public-random --quick --solver "./build/debug/tests/tactix-public-random {proof} --random-policy={seed}" --no-shrink --n 150

      - name: Stateful IPASIR query integration fuzz
        run: |
          python3 tools/fuzz/ipasir_trace.py \
            --driver "build/${{ matrix.mode }}/tests/tactix-ipasir-trace" \
            --reference cadical/build/cadical \
            --seed 0 --n 16 --minimize \
            --out "build/${{ matrix.mode }}/ipasir-integration-fuzz"

  python-api:
    uses: ./.github/workflows/python.yml
