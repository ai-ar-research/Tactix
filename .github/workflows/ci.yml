# CI checks the validator harness, native Debug/Release solver, and Python API
# in parallel, using the pinned solver/checker toolchain.
name: ci

on:
  # The full sanitizer, checker-toolchain, and fuzz matrix is intentionally
  # weekly to keep GitHub Actions minutes bounded. Run it on demand before a
  # milestone merge with the Actions UI when fresher evidence is required.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install verified-checker build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elan zstd
      - name: Cache third-party toolchain builds
        uses: actions/cache@v4
        with:
          path: |
            kissat
            cadical
            drat-trim
            cake_lpr
            dsr-trim-sr
            trestle
            ~/.elan
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/solvers/setup.sh', 'tools/checkers/setup.sh', 'tools/checkers/patches/**') }}
      - name: Build baseline solvers (kissat, cadical — pinned)
        run: tools/solvers/setup.sh
      - name: Build checker toolchain (drat-trim, lrat-check, cake_lpr — pinned)
        run: tools/checkers/setup.sh
      - name: Fuzz harness self-test (stand-ins + broken wrappers + ddmin)
        run: tools/fuzz/selftest.sh

  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install verified-checker build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elan zstd
      - name: Cache third-party toolchain builds
        uses: actions/cache@v4
        with:
          path: |
            kissat
            cadical
            drat-trim
            cake_lpr
            dsr-trim-sr
            trestle
            ~/.elan
            tools/checkers/src
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/solvers/setup.sh', 'tools/checkers/setup.sh', 'tools/checkers/patches/**') }}
      - name: Build baseline solvers (kissat, cadical — pinned)
        run: tools/solvers/setup.sh
      - name: Build checker toolchain (clausal + VeriPB/CakePB — pinned)
        run: tools/checkers/setup.sh
      # Every test links the solver. Keep sanitizer assertions/instrumentation,
      # with the same compact debug info as build.yml to fit the runner's disk.
      - name: Build tactix
        run: |
          cmake --preset ${{ matrix.mode }} -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DCMAKE_C_FLAGS_DEBUG=-g1
          cmake --build build/${{ matrix.mode }} --parallel 2
      - name: Unit + micro-proof tests
        run: |
          ctest --preset ${{ matrix.mode }} --no-tests=error --output-log build/${{ matrix.mode }}/ctest.log
          ! grep -E '\*\*\*Skipped|Not Run' build/${{ matrix.mode }}/ctest.log
      - name: Competition compliance
        if: matrix.mode == 'release'
        run: tools/compete/check.sh ./build/release/tactix
      # 300 cases: the GH runner is ~4x slower than the reference machine;
      # the full 1000-case --quick gate runs locally per commit, volume
      # coverage is the nightly job's business (plan §8.2 cadence)
      - name: Quick fuzz (debug build, all oracles)
        if: matrix.mode == 'debug'
        run: tools/fuzz/run.sh --quick --solver ./build/debug/tactix --no-shrink --n 300

      # rule-order fuzzing (plan §8.2): random legal schedules + random
      # branching instances through the same four oracles — the modularity
      # property (N1) under continuous test
      - name: Quick fuzz, random rule schedule (debug build)
        if: matrix.mode == 'debug'
        run: tools/fuzz/run.sh --public-random --quick --solver "./build/debug/tests/tactix-public-random --pbp --random-policy={seed}" --no-shrink --n 150

      - name: Stateful IPASIR query integration fuzz
        run: |
          python3 tools/fuzz/ipasir_trace.py \
            --driver "build/${{ matrix.mode }}/tests/tactix-ipasir-trace" \
            --reference cadical/build/cadical \
            --seed 0 --n 16 --minimize --corpus tools/fuzz/ipasir-corpus \
            --out "build/${{ matrix.mode }}/ipasir-integration-fuzz"

  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install verified-checker build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elan zstd
      - name: Cache third-party toolchain builds
        uses: actions/cache@v4
        with:
          path: |
            kissat
            cadical
            drat-trim
            cake_lpr
            dsr-trim-sr
            trestle
            ~/.elan
            tools/checkers/src
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/solvers/setup.sh', 'tools/checkers/setup.sh', 'tools/checkers/patches/**') }}
      - name: Build pinned solvers and checkers
        run: |
          tools/solvers/setup.sh
          tools/checkers/setup.sh
      - name: Build the reusable Python library
        run: |
          cmake -S . -B build/python-api -DCMAKE_BUILD_TYPE=Release -DTACTIX_BUILD_SHARED_IPASIR=ON
          cmake --build build/python-api --target tactix_shared --parallel 2
      - name: Python ABI, programmable strategy parity, and session/core tests
        run: |
          ctest --test-dir build/python-api --output-on-failure --output-log build/python-api/python-tests.log -R '^python_(capi|policy_parity|session)$'
          python3 - <<'PY'
          from pathlib import Path
          log = Path('build/python-api/python-tests.log').read_text()
          assert 'out of 3' in log and '***Skipped' not in log and 'Not Run' not in log
          PY
