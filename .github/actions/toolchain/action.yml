name: Pinned toolchain
description: Restore or build the pinned baseline solvers and proof checkers.
inputs:
  sanitizer:
    description: Also install the clang-18 sanitizer compiler.
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache third-party toolchain builds
      uses: actions/cache@v4
      with:
        path: |
          kissat
          cadical
          drat-trim
          cake_lpr
          dsr-trim-sr
          trestle
          ~/.elan
          tools/checkers/src
        key: toolchain-${{ runner.os }}-${{ hashFiles('tools/solvers/setup.sh', 'tools/checkers/setup.sh', 'tools/checkers/patches/**') }}
    - name: Install missing verified-checker build tools
      shell: bash
      run: |
        if ! command -v zstd >/dev/null || [ ! -x trestle/.lake/build/bin/srcheck ]; then
          sudo apt-get update
          sudo apt-get install --yes elan zstd
        fi
    - name: Install sanitizer compiler
      if: inputs.sanitizer == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes clang-18 llvm-18 libclang-rt-18-dev
    - name: Build pinned solvers (kissat, cadical) and checkers (clausal + VeriPB/CakePB)
      shell: bash
      run: |
        tools/solvers/setup.sh
        tools/checkers/setup.sh
